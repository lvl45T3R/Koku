[package]
name = "aether-android"
version = "0.4.0"
edition = "2021"
rust-version = "1.98"
build = "build.rs"

[lib]
name = "aether_android"
crate-type = ["cdylib"]

[dependencies]
aether = { path = "../engine/aether", features = ["tor"] }
tun2proxy = { path = "../third_party/tun2proxy", default-features = false }
tun = { version = "0.8.14", features = ["async"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
android_log-sys = "0.3"
jni = "0.21"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
